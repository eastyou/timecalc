[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "timecalc"
version = "0.1.0"
description = "时间计算：时刻加减、时长统计、12 小时制转换与课表生成"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "eastyou" }]
keywords = ["education", "time", "schedule", "teaching"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
timecalc = "timecalc.cli:main"

[tool.setuptools]
packages = ["timecalc"]
